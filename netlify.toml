# Netlify hosting (owner, 10 Nov 2026: replaces uploading to Crazy Domains' File Manager).
# Static site, no build: every merge to main goes live. Does what .htaccess did on Apache:
# www -> bare domain and caching (Pretty URLs add the trailing slash to folder pages). Netlify makes
# http -> https itself once the certificate is issued.

[build]
  publish = "."
  command = ""

# www.abackpackersdream.com.au -> https://abackpackersdream.com.au, one 301.
[[redirects]]
  from = "https://www.abackpackersdream.com.au/*"
  to = "https://abackpackersdream.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.abackpackersdream.com.au/*"
  to = "https://abackpackersdream.com.au/:splat"
  status = 301
  force = true

# No trailing-slash rules for the legal pages (/terms, /privacy-policy, ...): Netlify matches
# redirects with or without the trailing slash, so "/terms -> /terms/" sent /terms/ to itself
# in a loop. Netlify's Pretty URLs already add the slash to folder pages.

# Repo files that aren't part of the site: not served.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.htaccess"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

# Caching, as .htaccess: images kept 30 days; CSS and JS 7 days (legal.css is linked with ?v=N); sitemap 1 day.
# Pages: Netlify's own default (browsers check on every visit), so edits show at once.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
